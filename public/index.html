<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Citation Compass</title>
<meta name="description" content="Explore how research ideas connect — citations, collaborators and topic trails through a graph of ML papers." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <a href="#/" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M20 6 L23 18 L20 34 L17 18 Z" fill="currentColor" opacity="0.9"/>
        <path d="M6 20 L18 17 L34 20 L18 23 Z" fill="currentColor" opacity="0.5"/>
        <circle cx="20" cy="20" r="2.2" fill="currentColor"/>
      </svg>
      <span>Citation&nbsp;Compass</span>
    </a>
    <nav class="topnav">
      <a href="#/">Search</a>
      <a href="#/path">Path finder</a>
    </nav>
    <div id="stats-strip" class="stats-strip" aria-live="polite"></div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <p>Citation Compass — a graph-database demo built on CognoDB. Data: a curated set of well-known machine-learning papers, for illustration only.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="app.js"></script>

</html>
